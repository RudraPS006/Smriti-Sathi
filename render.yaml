# Unit VI — deploy to Render (third-party hosting) straight from the GitHub repo.
# MongoDB is not offered by Render: create a free cluster on MongoDB Atlas and
# paste its connection string into MONGO_URI in the Render dashboard.
services:
  - type: web
    name: smriti-sathi
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma db push --skip-generate
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: smriti-postgres
          property: connectionString
      - key: MONGO_URI
        sync: false            # set in dashboard (MongoDB Atlas)
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false            # optional; leave empty for mock mode
      - key: I18N_SERVICE_URL
        fromService:
          type: web
          name: smriti-i18n
          property: hostport   # private network address; the app adds http://

  - type: web
    name: smriti-i18n
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node i18n-service/server.js
    healthCheckPath: /health

databases:
  - name: smriti-postgres
    plan: free
